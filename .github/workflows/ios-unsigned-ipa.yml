name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - 'ios-v*'

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.50.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Use CocoaPods instead of Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Build unsigned IPA
        run: bash scripts/build_unsigned_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KKRemote-unsigned-ipa
          path: build/KKRemote-unsigned.ipa
          if-no-files-found: error
