name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.24.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Build APK
        env:
          API_BASE_URL: https://shop1.new.tg/api/v1
          SIGNALING_URL: wss://shop1.new.tg/ws/signaling
        run: |
          rm -f pubspec.lock
          flutter pub get
          flutter build apk --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=SIGNALING_URL="$SIGNALING_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KKRemote-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
