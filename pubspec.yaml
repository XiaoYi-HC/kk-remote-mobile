name: kk_remote
description: KK远程移动主控端（Android / iOS）
publish_to: "none"
version: 1.2.5+41

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  flutter_webrtc: 1.6.3
  mobile_scanner: ^5.2.3
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  local_auth: ^2.3.0
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.2
  go_router: ^14.2.7
  device_info_plus: ^10.1.2
  package_info_plus: ^8.1.0
  connectivity_plus: ^6.0.5
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  intl: ^0.20.3
  path: ^1.9.0
  uuid: ^4.5.1
  wakelock_plus: ^1.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
